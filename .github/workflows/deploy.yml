name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment URLs
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          BASE_PATH_OVERRIDE: ${{ vars.BASE_PATH }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          repository_owner="${REPOSITORY%%/*}"
          repository_name="${REPOSITORY#*/}"
          site_url="${SITE_URL_OVERRIDE:-https://${repository_owner}.github.io}"

          if [[ -n "$BASE_PATH_OVERRIDE" ]]; then
            base_path="$BASE_PATH_OVERRIDE"
          elif [[ "$repository_name" == "${repository_owner}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository_name}/"
          fi

          printf 'SITE_URL=%s\n' "$site_url" >> "$GITHUB_ENV"
          printf 'BASE_PATH=%s\n' "$base_path" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
